name: Build Galaxy AI Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Generate Android project & Install dependencies
        run: |
          cp pubspec.yaml pubspec_backup.yaml
          cp lib/main.dart main_backup.dart

          rm -rf android
          flutter create --platforms=android --org com.galaxyai.player --project-name galaxy_ai_player .

          cp pubspec_backup.yaml pubspec.yaml
          cp main_backup.dart lib/main.dart
          rm pubspec_backup.yaml main_backup.dart

          # تحميل المكتبات أولاً لتعديل إعداداتها أيضاً
          flutter pub get

          # إجبار التطبيق وجميع المكتبات الخارجية (Plugins) على استخدام compileSdk 36 و minSdk 24
          find android ~/.pub-cache -name "build.gradle*" -type f -exec sed -i 's/flutter\.compileSdkVersion/36/g' {} +
          find android ~/.pub-cache -name "build.gradle*" -type f -exec sed -i 's/compileSdkVersion [0-9][0-9]/compileSdkVersion 36/g' {} +
          find android ~/.pub-cache -name "build.gradle*" -type f -exec sed -i 's/compileSdk = [0-9][0-9]/compileSdk = 36/g' {} +
          find android ~/.pub-cache -name "build.gradle*" -type f -exec sed -i 's/compileSdk [0-9][0-9]/compileSdk 36/g' {} +
          find android -name "build.gradle*" -type f -exec sed -i 's/flutter\.minSdkVersion/24/g' {} +
          find android -name "build.gradle*" -type f -exec sed -i 's/flutter\.targetSdkVersion/35/g' {} +

          # السماح باستخدام SDK 36 بدون تحذيرات في Gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          # إضافة صلاحيات الإنترنت وقراءة الفيديو في AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/>\n    <application/g' "$MANIFEST"
          fi

      - name: Build Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-AI-Video-Player-APK
          path: build/app/outputs/flutter-apk/app-release.apk
