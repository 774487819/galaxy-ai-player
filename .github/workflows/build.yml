name: Build Galaxy AI Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project & Force compileSdk 36
        run: |
          cp pubspec.yaml pubspec_backup.yaml
          cp lib/main.dart main_backup.dart

          rm -rf android
          flutter create --platforms=android --org com.galaxyai.player --project-name galaxy_ai_player .

          cp pubspec_backup.yaml pubspec.yaml
          cp main_backup.dart lib/main.dart
          rm pubspec_backup.yaml main_backup.dart

          # إجبار ملف build.gradle (Groovy) على استخدام compileSdk 36 و minSdk 24
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/^[[:space:]]*compileSdk.*/        compileSdk 36/g' android/app/build.gradle
            sed -i 's/^[[:space:]]*minSdk.*/        minSdk 24/g' android/app/build.gradle
            sed -i 's/^[[:space:]]*targetSdk.*/        targetSdk 35/g' android/app/build.gradle
          fi

          # إجبار ملف build.gradle.kts (Kotlin) على استخدام compileSdk = 36 و minSdk = 24
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/^[[:space:]]*compileSdk.*/    compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/^[[:space:]]*minSdk.*/        minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/^[[:space:]]*targetSdk.*/        targetSdk = 35/g' android/app/build.gradle.kts
          fi

          # إضافة صلاحيات الإنترنت وقراءة الفيديو في AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/>\n    <application/g' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-AI-Video-Player-APK
          path: build/app/outputs/flutter-apk/app-release.apk
